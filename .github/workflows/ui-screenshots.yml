name: Vanta UI screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - "build.gradle"
      - "gradle.properties"
      - "src/client/java/name/vantaclient/client/gui/**"
      - "src/client/java/name/vantaclient/client/hudeditor/**"
      - "src/client/resources/**"
      - "src/gametest/**"
      - ".github/workflows/ui-screenshots.yml"

permissions:
  contents: read

jobs:
  capture:
    name: Launch Minecraft and capture Vanta UI
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "21"

      - name: Install virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run real Minecraft client screenshot tests
        run: xvfb-run -a ./gradlew runClientGameTest --stacktrace

      - name: Verify screenshot count
        run: |
          find build/run/clientGameTest/screenshots -type f -name '*.png' -maxdepth 1 -print
          count=$(find build/run/clientGameTest/screenshots -maxdepth 1 -type f -name '*.png' | wc -l)
          echo "Captured screenshot count: $count"
          test "$count" -eq 32

      - name: Upload Minecraft screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vanta-ui-screenshots
          path: build/run/clientGameTest/screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload client test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vanta-ui-test-diagnostics
          path: |
            build/run/
            build/run/clientGameTest/screenshots/
            build/reports/
          if-no-files-found: warn
          retention-days: 7
