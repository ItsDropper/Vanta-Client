# Build a compact mod JAR for each supported WebRTC native platform.
name: build
on: [pull_request, push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        platform:
          - windows-x86_64
          - windows-aarch64
          - macos-x86_64
          - macos-aarch64
          - linux-x86_64
          - linux-aarch64
          - linux-aarch32
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build -Pwebrtc_platform=${{ matrix.platform }}
      - name: build VantaLoader artifact
        if: matrix.platform == 'linux-x86_64'
        run: ./gradlew vantaLoaderJar -Pwebrtc_platform=${{ matrix.platform }}
      - name: diagnose generated Mixin refmaps
        shell: bash
        run: |
          echo "Generated refmap candidates:"
          find build -type f -iname '*refmap*.json' -print | sort
          echo "Refmap-related build outputs:"
          find build -type f | grep -Ei 'refmap|mixin' | sort | head -100 || true
      - name: verify exactly one WebRTC native platform is bundled
        shell: bash
        run: |
          shopt -s nullglob
          artifacts=(build/libs/dropperutils-*-*-${{ matrix.platform }}.jar)
          test "${#artifacts[@]}" -eq 1
          artifact="${artifacts[0]}"
          native_jars="$(jar tf "$artifact" | grep -E '^META-INF/jars/.*-(windows|macos|linux)-(x86_64|aarch64|aarch32)\.jar$' || true)"
          printf '%s\n' "$native_jars"
          test "$(printf '%s\n' "$native_jars" | grep -c .)" -eq 1
          [[ "$native_jars" == *"-${{ matrix.platform }}.jar"* ]]

          # Mixin targets are compiled against official Mojang names but run
          # under Fabric intermediary names. Require the generated refmap in
          # every distributed Fabric artifact so accessors and injections
          # resolve their runtime selectors correctly.
          jar tf "$artifact" | grep -Fx "dropperutils.mixins.json"
          jar tf "$artifact" | grep -Fx "dropperutils.refmap.json"
          unzip -p "$artifact" dropperutils.mixins.json | grep -Fq '"refmap": "dropperutils.refmap.json"'
          unzip -p "$artifact" dropperutils.refmap.json | grep -Fq '"mappings"'
      - name: upload platform mod
        uses: actions/upload-artifact@v7
        with:
          name: Vanta-Client-${{ matrix.platform }}
          path: build/libs/dropperutils-*-*-${{ matrix.platform }}.jar
          if-no-files-found: error
      - name: upload VantaLoader artifact
        if: matrix.platform == 'linux-x86_64'
        uses: actions/upload-artifact@v7
        with:
          name: VantaLoader-compatible-artifact
          path: build/libs/*-vantaloader.jar
          if-no-files-found: error
