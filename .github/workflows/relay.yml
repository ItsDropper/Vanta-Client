name: Vanta relay service

on:
  push:
    paths:
      - "relay/**"
      - ".github/workflows/relay.yml"
  pull_request:
    paths:
      - "relay/**"
      - ".github/workflows/relay.yml"

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache-dependency-path: relay/go.sum
      - name: Download dependencies
        run: go mod tidy
      - name: Run unit and relay integration tests
        run: go test -race -count=1 ./...
      - name: Verify relay builds
        run: go build ./cmd/vanta-relay
