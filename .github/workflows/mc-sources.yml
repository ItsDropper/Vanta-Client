name: Dump Minecraft sources

# Developer tool: decompiles the project's Minecraft version with Loom and pushes the
# client GUI classes to the `ci-artifacts-sources` branch so UI work can be written
# against the real API instead of guessed signatures.

on:
  workflow_dispatch:
  push:
    branches:
      - "tools/mc-sources"

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "21"

      - name: Generate Minecraft sources
        run: |
          chmod +x ./gradlew
          ./gradlew genSources --stacktrace

      - name: Collect GUI sources
        if: always()
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/mc-src"
          rm -rf "$OUT"; mkdir -p "$OUT"
          find "$HOME/.gradle" "$GITHUB_WORKSPACE/.gradle" -name '*sources.jar' 2>/dev/null | tee "$OUT/JARS.txt" || true
          grep -i minecraft "$OUT/JARS.txt" | while read -r jar; do
            name="$(basename "$jar" .jar)"
            mkdir -p "$OUT/$name"
            unzip -q -o "$jar" \
              'net/minecraft/client/gui/*' \
              'net/minecraft/client/renderer/PanoramaRenderer.java' \
              'net/minecraft/client/renderer/CubeMap.java' \
              'net/minecraft/client/renderer/RenderPipelines.java' \
              'net/minecraft/client/Minecraft.java' \
              'net/minecraft/client/Options.java' \
              'net/minecraft/network/chat/Component.java' \
              'net/minecraft/network/chat/CommonComponents.java' \
              'net/minecraft/resources/Identifier.java' \
              'net/minecraft/util/ARGB.java' \
              'net/minecraft/util/Mth.java' \
              -d "$OUT/$name" || true
          done
          du -sh "$OUT"

      - name: Publish to ci-artifacts-sources branch
        if: always()
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mc-src"
          git init -q
          git checkout -q -b ci-artifacts-sources
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -q -m "Minecraft sources for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-artifacts-sources
