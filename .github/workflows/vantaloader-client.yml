name: VantaLoader client integration
on:
  push:
    branches: [main]
    paths:
      - "vantaloader/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - ".github/workflows/vantaloader-client.yml"
  pull_request:
    paths:
      - "vantaloader/**"
      - "build.gradle"
      - "gradle.properties"
      - ".github/workflows/vantaloader-client.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vantaloader-client-${{ github.ref }}
  cancel-in-progress: true
jobs:
  launch:
    name: Build and launch Vanta Client on VantaLoader
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: ItsDropper/VantaLoader
          ref: nightly-0.1.0-20261106-9ef67ef
          path: loader
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14"
      - name: Install headless graphics
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool libgl1-mesa-dri libglx-mesa0 libxrandr2 libxinerama1 libxcursor1 libxi6 libxrender1 libxtst6 libxkbcommon0 libopenal1 libasound2t64
      - name: Build VantaLoader-native Vanta Client
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build vantaLoaderJar -Pwebrtc_platform=linux-x86_64
          test -s build/libs/dropperutils-2.3.0-1.21.11-vantaloader.jar
          if jar tf build/libs/dropperutils-2.3.0-1.21.11-vantaloader.jar | grep -Eq '^(fabric\.mod\.json|net/fabricmc/|com/terraformersmc/)'; then
            echo "Native VantaLoader artifact contains Fabric runtime metadata/classes"
            exit 1
          fi
      - name: Build matching VantaLoader agent and integration probes
        run: |
          for gradle_file in loader/build.gradle.kts loader/examples/*/build.gradle.kts; do
            sed -i 's@repositories { mavenCentral() }@repositories { maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }; mavenCentral() }@' "$gradle_file"
          done
          gradle --no-daemon -p loader clean build
          gradle --no-daemon -p loader/examples/hello-mod clean build
          gradle --no-daemon -p loader/examples/auto-sprint clean build
          sed -i 's/entries=2/entries=3/g' loader/scripts/ci/minecraft_visual_smoke.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("loader/scripts/ci/minecraft_visual_smoke.py")
          source = path.read_text(encoding="utf-8")
          needle = '            shutil.copy2(output / "mod-menu-probe.png", output / "mod-menu.png")\n'
          addition = '''
                      # Vanta Client is the second sorted entry; its native ModMenuApi
                      # button is positioned at logical (508, 124) on the 640x360 UI.
                      subprocess.run(["xdotool", "mousemove", "--sync", "1128", "268"], check=True, timeout=10)
                      time.sleep(1)
                      subprocess.run(["xdotool", "click", "--clearmodifiers", "--delay", "100", "1"], check=True, timeout=10)
                      wait_for_log_marker(process, log_path, "[Vanta Client] Native settings screen opened from VantaLoader Mod Menu", 20)
                      time.sleep(3)
                      subprocess.run(["java", "-cp", str(Path(__file__).resolve().parent), "ScreenCapture",
                                      str(output / "vanta-client-settings.png")], check=True, timeout=15)
          '''
          if needle not in source:
              raise SystemExit("Could not locate mod-menu screenshot insertion point")
          path.write_text(source.replace(needle, needle + addition), encoding="utf-8")
          PY
      - name: Launch Minecraft with VantaLoader and Vanta Client
        env:
          VANTA_MINECRAFT_CACHE: ${{ runner.temp }}/minecraft/1.21.11
        run: |
          cd loader
          javac scripts/ci/ScreenCapture.java
          XCURSOR_THEME=DMZ-White XCURSOR_SIZE=24 xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" bash scripts/ci/run_visual_smoke.sh \
            --agent build/agent/VantaLoader-agent.jar \
            --mod ../build/libs/dropperutils-2.3.0-1.21.11-vantaloader.jar \
            --mod examples/hello-mod/build/libs/vantaloader-hello-mod-1.0.0.jar \
            --mod examples/auto-sprint/build/libs/vantaloader-auto-sprint-1.0.0.jar \
            --output ../build/vantaloader-client-smoke --timeout 240
      - name: Assert Vanta Client initialized
        run: |
          log=build/vantaloader-client-smoke/instance/logs/visual-smoke.log
          if [ -f "$log" ]; then
            grep -F "Vanta Client native bootstrap initialized" "$log"
            grep -F "[Vanta Client] VantaLoader tick START observed" "$log"
            grep -F "[Vanta Client] VantaLoader tick END observed" "$log"
            # A discovered mod and a running event bus are not proof that its
            # Minecraft integration works. Require the title-screen Mixin to
            # actually transform the target and reject failed lobby/accessor setup.
            grep -F "Sponge Mixin processed Minecraft TitleScreen; bytecodeChanged=true" "$log"
            if grep -Eq "ClassCastException:.*name\\.vantaclient\\.mixin\\.|NoSuchMethodError:|Unable to create the Vanta title world" "$log"; then
              echo "Vanta Client has unresolved Minecraft runtime integration failures"
              exit 1
            fi
            test -s build/vantaloader-client-smoke/vanta-client-settings.png
          else
            echo "Minecraft log was not produced"
            exit 1
          fi
      - name: Upload screenshots and launch logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vantaloader-vanta-client-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build/vantaloader-client-smoke/
            build/reports/
          if-no-files-found: warn
          retention-days: 30
