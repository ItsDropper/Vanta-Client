pluginManagement {
	repositories {
		// Prefer Maven Central for shared third-party libraries. Fabric's mirror
		// can contain upstream POMs without their parent POMs, which breaks
		// Gradle metadata parsing before it can fall back to Central.
		maven { url = 'https://maven-central.storage-download.googleapis.com/maven2/' }
		mavenCentral {
			content { excludeGroupByRegex('net\\.fabricmc(\\..*)?') }
		}
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
			content { includeGroupByRegex('net\\.fabricmc(\\..*)?') }
		}
		gradlePluginPortal()
	}
}

// Should match your modid
rootProject.name = 'dropperutils'
