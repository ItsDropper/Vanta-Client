plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Resolve common transitive libraries from Central before specialized mod repositories.
	mavenCentral()

	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}

	maven { url = "https://maven.fabricmc.net/" }
}

loom {
	accessWidenerPath = file("src/main/resources/dropperutils.accesswidener")
	splitEnvironmentSourceSets()

	mods {
		"dropperutils" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "vanta-ui-screenshot-tests"
		enableGameTests = false
		enableClientGameTests = true
		eula = false
	}
}

// VantaLoader's API is compile-only: the loader owns these classes at runtime.
def vantaLoaderApiFile = layout.buildDirectory.file("vanta-loader/VantaLoader-api.jar")
def resolveVantaLoaderApi = tasks.register("resolveVantaLoaderApi") {
	outputs.file(vantaLoaderApiFile)
	doLast {
		def target = vantaLoaderApiFile.get().asFile
		target.parentFile.mkdirs()
		if (!target.isFile() || !target.bytes) {
			def temporary = new File(target.parentFile, target.name + ".tmp")
			new URL("https://github.com/ItsDropper/VantaLoader/releases/download/nightly-0.1.0-20261106-fcfe266/VantaLoader-api.jar").withInputStream { input ->
				temporary.withOutputStream { output -> output << input }
			}
			def digest = java.security.MessageDigest.getInstance("SHA-256")
			def actual = digest.digest(temporary.bytes).encodeHex().toString()
			if (actual != "534c75e5fdc22756f86489015d23c54d30c8de8d04a243a624ee5ae1c3377bbe") {
				temporary.delete()
				throw new GradleException("VantaLoader API checksum mismatch: " + actual)
			}
			if (!temporary.renameTo(target)) {
				target.bytes = temporary.bytes
				temporary.delete()
			}
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	dependsOn(resolveVantaLoaderApi)
}

tasks.matching { it.name == "remapSourcesJar" }.configureEach {
	dependsOn(resolveVantaLoaderApi)
}

dependencies {
	compileOnly files(vantaLoaderApiFile)
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional compile-time integration; Mod Menu is not bundled or required at runtime.
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	// WebRTC data transport. Package every desktop native classifier so the same
	// published mod works on Windows, macOS and Linux regardless of CI host OS.
	def webrtcVersion = project.webrtc_java_version
	def webrtcNativeClassifiers = [
		"windows-x86_64", "windows-aarch64",
		"macos-x86_64", "macos-aarch64",
		"linux-x86_64", "linux-aarch64", "linux-aarch32"
	]
	implementation "dev.onvoid.webrtc:webrtc-java:${webrtcVersion}"
	include "dev.onvoid.webrtc:webrtc-java:${webrtcVersion}"
	webrtcNativeClassifiers.each { classifier ->
		def artifact = "dev.onvoid.webrtc:webrtc-java:${webrtcVersion}:${classifier}"
		implementation artifact
		include artifact
	}

	// The production client-test launcher needs Fabric API in its runtime installation.
	productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

base {
	archivesName = "dropperutils"
}

tasks.named("remapJar") {
	archiveFileName = "dropperutils-${project.mod_version}-${project.minecraft_version}.jar"
}


processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching(["fabric.mod.json", "vanta.mod.json"]) {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE.local") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving artifacts.
	}
}
