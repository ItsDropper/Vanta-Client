plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Resolve common transitive libraries from Central before specialized mod repositories.
	mavenCentral()

	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}

	maven { url = "https://maven.fabricmc.net/" }
}

loom {
	accessWidenerPath = file("src/main/resources/dropperutils.accesswidener")
	splitEnvironmentSourceSets()

	mods {
		"dropperutils" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "vanta-ui-screenshot-tests"
		enableGameTests = false
		enableClientGameTests = true
		eula = false
	}
}

// Keep the loader API compile-only; the loader supplies it at runtime.
// Resolve the matching agent separately so it can be installed as the JVM agent.
def vantaLoaderReleaseTag = "nightly-0.1.0-20261106-5a9190a"
def vantaLoaderReleaseBaseUrl = "https://github.com/ItsDropper/VantaLoader/releases/download/${vantaLoaderReleaseTag}"
def vantaLoaderApiFile = layout.buildDirectory.file("vanta-loader/VantaLoader-api.jar")
def vantaLoaderAgentFile = layout.buildDirectory.file("libs/VantaLoader-agent.jar")

def vantaLoaderSha256 = { File file ->
	def digest = java.security.MessageDigest.getInstance("SHA-256")
	digest.digest(file.bytes).encodeHex().toString()
}

def resolveVantaLoaderRuntime = tasks.register("resolveVantaLoaderRuntime") {
	outputs.files(vantaLoaderApiFile, vantaLoaderAgentFile)
	doLast {
		def artifacts = [
			[
				name: "VantaLoader-api.jar",
					target: vantaLoaderApiFile.get().asFile,
					sha256: "f278a7ddaf631e4c9c74f41dc3c02a1370e457668a226e4d8bd838ad503a6eb1"
			],
			[
				name: "VantaLoader-agent.jar",
				target: vantaLoaderAgentFile.get().asFile,
				sha256: "79349e50986268521e47a9832da09f1f8eacb4599f7b4c81f6be92713a21eb11"
			]
		]

		artifacts.each { artifact ->
			def target = artifact.target as File
			target.parentFile.mkdirs()

			if (!target.isFile() || vantaLoaderSha256(target) != artifact.sha256) {
				def temporary = new File(target.parentFile, target.name + ".tmp")
				if (temporary.exists()) {
					temporary.delete()
				}

				new URL("${vantaLoaderReleaseBaseUrl}/${artifact.name}").withInputStream { input ->
					temporary.withOutputStream { output -> output << input }
				}

				def actual = vantaLoaderSha256(temporary)
				if (actual != artifact.sha256) {
					temporary.delete()
					throw new GradleException("VantaLoader ${artifact.name} checksum mismatch: " + actual)
				}

				if (!temporary.renameTo(target)) {
					target.bytes = temporary.bytes
					temporary.delete()
				}
			}
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	dependsOn(resolveVantaLoaderRuntime)
}

tasks.matching { it.name == "remapSourcesJar" }.configureEach {
	dependsOn(resolveVantaLoaderRuntime)
}

dependencies {
	compileOnly files(vantaLoaderApiFile)
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional compile-time integration; Mod Menu is not bundled or required at runtime.
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	// WebRTC data transport. Package every desktop native classifier so the same
	// published mod works on Windows, macOS and Linux regardless of CI host OS.
	def webrtcVersion = project.webrtc_java_version
	def webrtcNativeClassifiers = [
		"windows-x86_64", "windows-aarch64",
		"macos-x86_64", "macos-aarch64",
		"linux-x86_64", "linux-aarch64", "linux-aarch32"
	]
	implementation "dev.onvoid.webrtc:webrtc-java:${webrtcVersion}"
	include "dev.onvoid.webrtc:webrtc-java:${webrtcVersion}"
	webrtcNativeClassifiers.each { classifier ->
		def artifact = "dev.onvoid.webrtc:webrtc-java:${webrtcVersion}:${classifier}"
		implementation artifact
		include artifact
	}

	// The production client-test launcher needs Fabric API in its runtime installation.
	productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

base {
	archivesName = "dropperutils"
}

tasks.named("remapJar") {
	archiveFileName = "dropperutils-${project.mod_version}-${project.minecraft_version}.jar"
}

// VantaLoader uses official Mojang names at runtime, so it must receive the
// named-mapping class files produced by Loom before remapJar converts them to
// Fabric intermediary names. Keep this artifact separate from the Fabric JAR.
tasks.register("vantaLoaderJar", Jar) {
	dependsOn(tasks.named("classes"), tasks.named("clientClasses"))
	archiveFileName = "dropperutils-${project.mod_version}-${project.minecraft_version}-vantaloader.jar"
	from(sourceSets.main.output)
	from(sourceSets.client.output)
	from("LICENSE.local") {
		rename { "${it}_${project.name}" }
	}
	manifest {
		attributes("Vanta-Mapping-Namespace": "official-mojang")
	}
}


processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching(["fabric.mod.json", "vanta.mod.json"]) {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE.local") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving artifacts.
	}
}
