plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Resolve common transitive libraries from Central before specialized mod repositories.
	maven { url = 'https://maven-central.storage-download.googleapis.com/maven2/' }
	mavenCentral {
		content {
			excludeGroupByRegex('net\\.fabricmc(\\..*)?')
			excludeGroupByRegex('com\\.terraformersmc(\\..*)?')
		}
	}

	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
		content { includeGroupByRegex('com\\.terraformersmc(\\..*)?') }
	}

	maven {
		url = "https://maven.fabricmc.net/"
		content { includeGroupByRegex('net\\.fabricmc(\\..*)?') }
	}
}

// VantaLoader is a genuinely separate source tree. It is compiled against the
// same official-mapped Minecraft and compile-time APIs, but its distributable
// contains no Fabric descriptor or Fabric runtime libraries.
sourceSets {
	vantaloader {
		java.srcDir("vantaloader/src/main/java")
		resources.srcDir("vantaloader/src/main/resources")
	}
}

loom {
	mixin {
		// The native source set is compiled separately from Loom's standard
		// Fabric source sets, so explicitly generate its Mixin refmap.
		useLegacyMixinAp = true
		defaultRefmapName = "vantaloader-dropperutils.refmap.json"
	}
	accessWidenerPath = file("src/main/resources/dropperutils.accesswidener")
	splitEnvironmentSourceSets()

	mods {
		"dropperutils" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
			// The standalone VantaLoader source set contains the same Mixin-backed
			// client UI and must participate in Loom's annotation processing so its
			// refmap is generated against the official Minecraft mappings.
			sourceSet sourceSets.vantaloader
		}
	}
}

 // Loom creates the split client source set above; wire it into the native
 // source set only after that source set exists.
sourceSets.named("vantaloader") {
	compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output
	runtimeClasspath += output + compileClasspath
}

tasks.named("processVantaloaderResources") {
	def nativeVersion = project.version
	inputs.property("version", nativeVersion)
	filesMatching("vanta.mod.json") { expand(version: nativeVersion) }
}


fabricApi {
	configureTests {
		createSourceSet = true
		modId = "vanta-ui-screenshot-tests"
		enableGameTests = false
		enableClientGameTests = true
		eula = false
	}
}

// Keep the loader API compile-only; the loader supplies it at runtime.
// Resolve the matching agent separately so it can be installed as the JVM agent.
def vantaLoaderReleaseTag = "nightly-0.1.0-20261106-9ef67ef"
def vantaLoaderReleaseBaseUrl = "https://github.com/ItsDropper/VantaLoader/releases/download/${vantaLoaderReleaseTag}"
def vantaLoaderApiFile = layout.buildDirectory.file("vanta-loader/VantaLoader-api.jar")
def vantaLoaderAgentFile = layout.buildDirectory.file("libs/VantaLoader-agent.jar")

def vantaLoaderSha256 = { File file ->
	def digest = java.security.MessageDigest.getInstance("SHA-256")
	digest.digest(file.bytes).encodeHex().toString()
}

def resolveVantaLoaderRuntime = tasks.register("resolveVantaLoaderRuntime") {
	outputs.files(vantaLoaderApiFile, vantaLoaderAgentFile)
	doLast {
		def artifacts = [
			[
				name: "VantaLoader-api.jar",
					target: vantaLoaderApiFile.get().asFile,
					sha256: "21aaf700a21f87b0c489f648010df25e3f14f43ec4f1a9afa36dab590bfdf429"
			],
			[
				name: "VantaLoader-agent.jar",
				target: vantaLoaderAgentFile.get().asFile,
				sha256: "8d0a6adf75c39cef573b65225318c43a3d04c23e82e4537f24c1396bd4fd7f10"
			]
		]

		artifacts.each { artifact ->
			def target = artifact.target as File
			target.parentFile.mkdirs()

			if (!target.isFile() || vantaLoaderSha256(target) != artifact.sha256) {
				def temporary = new File(target.parentFile, target.name + ".tmp")
				if (temporary.exists()) {
					temporary.delete()
				}

				new URL("${vantaLoaderReleaseBaseUrl}/${artifact.name}").withInputStream { input ->
					temporary.withOutputStream { output -> output << input }
				}

				def actual = vantaLoaderSha256(temporary)
				if (actual != artifact.sha256) {
					temporary.delete()
					throw new GradleException("VantaLoader ${artifact.name} checksum mismatch: " + actual)
				}

				if (!temporary.renameTo(target)) {
					target.bytes = temporary.bytes
					temporary.delete()
				}
			}
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	dependsOn(resolveVantaLoaderRuntime)
}

tasks.matching { it.name == "remapSourcesJar" }.configureEach {
	dependsOn(resolveVantaLoaderRuntime)
}

// Loom's nested-include configuration is declarable-only. Resolve it through
// a dedicated runtime configuration when assembling the standalone native JAR.
configurations {
	vantaLoaderRuntime {
		canBeConsumed = false
		canBeResolved = true
		extendsFrom configurations.include
	}
}

// WebRTC data transport. Native binaries are platform-specific, so each
// distributable embeds only the classifier selected for that target platform.
// CI builds one artifact per supported desktop OS/architecture.
def webrtcVersion = project.webrtc_java_version
def supportedWebRtcPlatforms = [
	"windows-x86_64", "windows-aarch64",
	"macos-x86_64", "macos-aarch64",
	"linux-x86_64", "linux-aarch64", "linux-aarch32"
] as Set

def detectedWebRtcOs = System.getProperty("os.name").toLowerCase(Locale.ROOT)
def detectedWebRtcArch = System.getProperty("os.arch").toLowerCase(Locale.ROOT)
def detectedWebRtcPlatformOs = detectedWebRtcOs.contains("win") ? "windows"
	: detectedWebRtcOs.contains("mac") || detectedWebRtcOs.contains("darwin") ? "macos"
	: detectedWebRtcOs.contains("linux") ? "linux"
	: null
def detectedWebRtcPlatformArch = detectedWebRtcArch in ["amd64", "x86_64"] ? "x86_64"
	: detectedWebRtcArch in ["aarch64", "arm64"] ? "aarch64"
	: detectedWebRtcArch in ["arm", "arm32", "armv7", "armv7l"] ? "aarch32"
	: null
def detectedWebRtcPlatform = detectedWebRtcPlatformOs && detectedWebRtcPlatformArch
	? "${detectedWebRtcPlatformOs}-${detectedWebRtcPlatformArch}"
	: null
def webrtcPlatform = (findProperty("webrtc_platform") ?: detectedWebRtcPlatform)?.toString()
if (!supportedWebRtcPlatforms.contains(webrtcPlatform)) {
	throw new GradleException(
		"Unsupported WebRTC target '${webrtcPlatform}'. Set -Pwebrtc_platform to one of: " +
			supportedWebRtcPlatforms.sort().join(", ")
	)
}


dependencies {
	compileOnly files(vantaLoaderApiFile)
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional compile-time integration; Mod Menu is not bundled or required at runtime.
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	implementation "dev.onvoid.webrtc:webrtc-java:${webrtcVersion}"
	include "dev.onvoid.webrtc:webrtc-java:${webrtcVersion}"

	def webrtcNativeArtifact = "dev.onvoid.webrtc:webrtc-java:${webrtcVersion}:${webrtcPlatform}"
	implementation webrtcNativeArtifact
	include webrtcNativeArtifact

	// The production client-test launcher needs Fabric API in its runtime installation.
	productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

base {
	archivesName = "dropperutils"
}

tasks.named("remapJar") {
	archiveFileName = "dropperutils-${project.mod_version}-${project.minecraft_version}-${webrtcPlatform}.jar"
}

// VantaLoader uses official Mojang names at runtime, so it must receive the
// named-mapping class files produced by Loom before remapJar converts them to
// Fabric intermediary names. Keep this artifact separate from the Fabric JAR.
tasks.register("vantaLoaderJar", Jar) {
	dependsOn(tasks.named("vantaloaderClasses"))
	archiveFileName = "dropperutils-${project.mod_version}-${project.minecraft_version}-vantaloader.jar"
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from(sourceSets.vantaloader.output)
	// WebRTC Java and the selected native classifier are the only bundled
	// runtime libraries. Fabric Loader/API and Mod Menu remain compile-only.
	from({ configurations.vantaLoaderRuntime.collect { zipTree(it) } }) {
		exclude("META-INF/MANIFEST.MF", "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA")
	}
	from("LICENSE.local") {
		rename { "${it}_${project.name}" }
	}
	manifest {
		attributes("Vanta-Mapping-Namespace": "official-mojang")
	}
}


processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching(["fabric.mod.json", "vanta.mod.json"]) {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE.local") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving artifacts.
	}
}
